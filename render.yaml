services:
  - type: web
    name: study-grove
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STUDY_ALLOWED_EMAILS
        sync: false
      - key: APP_URL
        sync: false
