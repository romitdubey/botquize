[project]
name = "life-science-study-desk"
version = "1.0.0"
description = "Mobile study website with a FastAPI backend and Telegram administration"
requires-python = ">=3.12,<3.15"
dependencies = [
    "python-telegram-bot==21.6",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
